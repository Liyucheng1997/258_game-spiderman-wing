<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模型查看器</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 8px; }
  #ui select { font-size: 14px; }
</style>
</head>
<body>
<div id="ui">
  模型 <select id="model"><option>spiderman</option><option>drone</option><option>car</option><option>props</option></select>
  姿态 <select id="pose">
    <option>idle</option><option>run</option><option>jump</option><option>fall</option>
    <option>swing</option><option>zip</option><option>wallrun</option><option>land</option><option>flip</option>
  </select>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { SpiderMan } from './js/spiderman.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a33);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0.8, 1.3, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.update();
const sun = new THREE.DirectionalLight(0xffe0c0, 2.5);
sun.position.set(2, 4, 3); sun.castShadow = true;
scene.add(sun, new THREE.HemisphereLight(0x8899ff, 0x443322, 0.6));
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshStandardMaterial({ color: 0x555560 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

let current = null, spidey = null, animFn = null;
async function load(name) {
  if (current) scene.remove(current);
  spidey = null; animFn = null;
  if (name === 'spiderman') {
    spidey = new SpiderMan();
    spidey.root.position.y = 0.92;
    current = spidey.root;
    controls.target.set(0, 0.95, 0);
  } else if (name === 'drone') {
    const { makeDrone } = await import('./js/drone.js');
    const d = makeDrone(); current = d.group; d.group.position.y = 1.5;
    animFn = (dt) => d.animate(dt, performance.now() / 1000);
    controls.target.set(0, 1.5, 0);
  } else if (name === 'car') {
    const { makeCarPreview } = await import('./js/props.js');
    current = makeCarPreview();
    controls.target.set(0, 0.8, 0);
  } else {
    const { makePropsPreview } = await import('./js/props.js');
    current = makePropsPreview();
    controls.target.set(0, 2, 0);
  }
  scene.add(current);
  controls.update();
}
document.getElementById('model').onchange = (e) => load(e.target.value);
load('spiderman');
window.__viewer = { camera, controls, scene, get spidey() { return spidey; } };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const pose = document.getElementById('pose').value;
  if (spidey) {
    spidey.update(dt, pose, {
      speed: 12, runPhase: clock.elapsedTime * 9, vy: Math.sin(clock.elapsedTime) * 10,
      webDirLocal: new THREE.Vector3(0.3, 1, 0.4).normalize(),
    });
  }
  if (animFn) animFn(dt);
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
